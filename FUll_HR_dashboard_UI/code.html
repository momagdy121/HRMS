<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password - HRMS Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-secondary": "#ffffff",
                        "background": "#f9f9fd",

                        "surface-container-high": "#e8e8ec",
                        "secondary-fixed": "#d3e4fe",
                        "tertiary-container": "#494c4e",
                        "primary-fixed-dim": "#a0cafc",
                        "outline": "#72777f",
                        "surface": "#f9f9fd",
                        "tertiary-fixed": "#e0e3e5",

                        "error-container": "#ffdad6",

                        "surface-container-highest": "#e2e2e6",
                        "on-error-container": "#93000a",

                        "secondary": "#505f76",
                        "surface-container": "#ededf2",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary-container": "#95bff1",

                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sidebar-collapsed": "72px",
                        "sm": "8px",
                        "lg": "24px",
                        "sidebar-width": "260px",
                        "base": "4px",
                        "xs": "4px",
                        "navbar-height": "64px",
                        "md": "16px",
                        "xl": "32px"

                    "fontFamily": {

                    "fontSize": {

                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-lg font-body-md">
<div class="w-full max-w-md">
<div class="text-center mb-lg">
<h1 class="font-h1 text-h1 text-primary-container mb-xs">HRMS Portal</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Management Console</p>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-xl">
<div class="mb-lg">
<h2 class="font-h2 text-h2 text-on-surface mb-xs">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your new password.</p>
</div>
<div class="mb-lg p-md bg-error-container border border-error/20 rounded-lg flex gap-md items-start">
<span class="material-symbols-outlined text-error mt-0.5">error</span>
<p class="font-body-sm text-body-sm text-on-error-container">The reset token is invalid or has expired. Please request a new reset link.</p>
</div>
<div class="mb-lg p-md bg-[#d1fad4]/20 border border-[#4caf50]/30 rounded-lg flex gap-md items-start hidden">
<span class="material-symbols-outlined text-[#4caf50] mt-0.5">check_circle</span>
<p class="font-body-sm text-body-sm text-[#2e7d32]">Password reset successfully. You can now sign in with your new password.</p>
</div>
<form class="space-y-md">
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-xs" for="email">Email Address</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-md py-3 font-body-md text-body-md text-on-surface-variant cursor-not-allowed opacity-70" disabled="" id="email" readonly="" type="email" value="jane.smith@company.com"/>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-xs" for="new-password">New Password</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="new-password" placeholder="••••••••" required="" type="password"/>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-xs" for="confirm-password">Confirm New Password</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="pt-sm">
<button class="w-full bg-primary-container hover:bg-primary text-on-primary font-label-bold text-label-bold py-3 px-lg rounded-lg transition-colors flex justify-center items-center gap-xs shadow-sm" type="submit">
<span>Reset Password</span>
<span class="material-symbols-outlined text-[18px]">lock_reset</span>
</button>
</div>
</form>
<div class="mt-lg text-center">
<a class="inline-flex items-center gap-xs font-body-sm text-body-sm text-primary-container hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[16px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    Back to Sign in
                </a>
</div>
</div>
</div>
</body></html>

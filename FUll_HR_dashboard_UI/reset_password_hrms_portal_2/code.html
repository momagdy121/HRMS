<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_2px_4px_rgba(0,0,0,0.05)] overflow-hidden">
<!-- Header Section -->
<header class="pt-xl px-xl pb-md text-center">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-on-primary mb-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">corporate_fare</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface mb-xs">HRMS Portal</h1>
</header>
<!-- Content Section -->
<section class="px-xl pb-xl">
<h2 class="font-h2 text-h2 text-on-surface mb-xs text-center">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-lg">Enter your new password.</p>
<!-- Error State Alert -->
<div class="bg-error-container text-on-error-container p-md rounded-lg mb-lg border border-[#f8b4b4] flex items-start gap-sm">
<span class="material-symbols-outlined mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-body-sm text-body-sm">The reset token is invalid or has expired. Please request a new reset link.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Email Field (Disabled) -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-xs" for="email">Email Address</label>
<input class="w-full rounded-DEFAULT border-outline-variant bg-surface-variant text-on-surface-variant font-body-md text-body-md px-md py-sm cursor-not-allowed opacity-70" disabled="" id="email" name="email" type="email" value="jane.smith@company.com"/>
</div>
<!-- New Password Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-xs" for="new_password">New Password</label>
<input class="w-full rounded-DEFAULT border-outline focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest text-on-surface font-body-md text-body-md px-md py-sm transition-colors" id="new_password" name="new_password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-xs" for="confirm_password">Confirm New Password</label>
<input class="w-full rounded-DEFAULT border-outline focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest text-on-surface font-body-md text-body-md px-md py-sm transition-colors" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary hover:bg-primary font-label-bold text-label-bold py-md rounded-DEFAULT transition-colors flex items-center justify-center gap-sm mt-lg shadow-sm" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
                    Reset Password
                </button>
</form>
<!-- Footer Link -->
<div class="mt-lg text-center">
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors font-medium" href="#">Back to Sign in</a>
</div>
</section>
